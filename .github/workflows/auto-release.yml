name: Auto Release

on:
  push:
    branches: [main]
    paths:
      - "custom_components/ipp_advanced/manifest.json"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version aus manifest.json auslesen
        id: version
        run: |
          VERSION=$(jq -r '.version' custom_components/ipp_advanced/manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prüfen, ob der Tag bereits existiert
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Eine Version mit einem Bindestrich (z. B. "0.2.0-beta.1",
      # semver-Pre-Release-Schema) wird als GitHub-Pre-Release markiert.
      # HACS zeigt Pre-Releases nur Nutzern an, die für diese Integration
      # explizit "Beta-Versionen anzeigen" aktiviert haben - alle anderen
      # bleiben automatisch auf der letzten regulären Version.
      - name: Auf Pre-Release-Versionsschema prüfen
        id: prerelease
        run: |
          if [[ "${{ steps.version.outputs.version }}" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag und Release erstellen
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          make_latest: ${{ steps.prerelease.outputs.is_prerelease == 'false' }}
